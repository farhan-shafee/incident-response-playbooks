name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-docs:
    name: Documentation structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Existing Bash playbook validation
        run: make validate

  offline-ir:
    name: Offline IR / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Python action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
      - name: Check immutable synthetic fixtures
        run: python -B scripts/generate_ir_fixtures.py --check
      - name: Compile offline case engine and tests
        run: python -B -m compileall -q ir_lab tests scripts/generate_ir_fixtures.py
      - name: Behavioral and adversarial tests
        run: python -B -m unittest discover -s tests -v
      - name: CLI positive and negative controls
        shell: bash
        run: |
          python -B -m ir_lab validate fixtures/ir_cases/positive.json
          python -B -m ir_lab validate fixtures/ir_cases/benign.json
          python -B -m ir_lab validate fixtures/ir_cases/incomplete.json
          if python -B -m ir_lab validate fixtures/ir_cases/adversarial.json; then
            echo "ERROR: adversarial case was accepted"
            exit 1
          fi
